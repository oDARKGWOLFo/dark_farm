<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Farm</title>
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1e3f20;
            color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none; -webkit-user-select: none;
        }

        /* Интерфейс UI (Верхний фиксированный слой) */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; width: 100%; }
        
        /* Деревянные панели ресурсов (как в оригинале) */
        .resource-panel {
            background: linear-gradient(to bottom, #a06a42, #5c3a21);
            border: 3px solid #362213; border-radius: 25px;
            display: flex; align-items: center; padding: 6px 16px;
            box-shadow: 0 6px 0 #20140b, 0 8px 15px rgba(0,0,0,0.5); min-width: 130px;
        }
        .resource-val { font-size: 16px; font-weight: bold; margin-left: 8px; color: #fff; text-shadow: 1px 1px 2px #000; }
        
        .side-menu { position: absolute; right: 10px; top: 120px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .menu-item {
            background: linear-gradient(135deg, #cc8c5c, #8c532b);
            border: 3px solid #4a2b15; border-radius: 14px;
            width: 70px; height: 70px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #2d190b, 0 6px 10px rgba(0,0,0,0.4);
        }
        
        .dialog-box {
            background: #fff9e6; border: 4px solid #8c6c53; border-radius: 20px;
            padding: 14px; display: flex; align-items: center; gap: 12px;
            color: #3b2211; font-weight: 600; font-size: 14px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); pointer-events: auto;
            margin-bottom: 10px; border-bottom: 8px solid #6e523c;
        }
        .avatar { width: 50px; height: 50px; background: #ffa726; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid #5c3a21; }

        /* Окна просмотра и ОГРОМНАЯ КАРТА */
        .viewport { width: 100%; height: 100%; overflow: hidden; position: relative; cursor: grab; }
        .viewport:active { cursor: grabbing; }
        
        /* Трава высокого качества (Бесшовная мультяшная текстура) */
        .map {
            width: 1600px; height: 1600px;
            background-image: url('https://freepik.com');
            background-size: 200px 200px;
            position: absolute; transform: translate3d(-400px, -400px, 0); will-change: transform;
        }

        /* Лес по краям карты для красоты */
        .map::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background-image: url('https://openclipart.org'); /* Иконки деревьев */
            background-size: 120px 120px; opacity: 0.15; pointer-events: none;
        }

        /* ТОРГОВЫЕ КАРТОЧКИ НА КАРТЕ */
        .buy-card {
            position: absolute; background: linear-gradient(to bottom, #b07a56, #7c4e31);
            border: 4px solid #4a2c16; border-radius: 18px; width: 160px; padding: 12px; text-align: center;
            box-shadow: 0 10px 0 #2d190b, 0 15px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .card-title { font-size: 14px; font-weight: bold; color: #fff8e1; text-shadow: 1px 1px 2px #000; }
        .card-price { font-size: 15px; font-weight: bold; color: #ffd54f; text-shadow: 1px 1px 1px #000; }
        .btn-buy {
            background: linear-gradient(to bottom, #4fc3f7, #0288d1); border: 2px solid #01579b; border-radius: 10px; color: white;
            width: 100%; padding: 8px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 0 #013966;
        }
        .btn-buy:active { transform: translateY(2px); box-shadow: none; }

        /* ОБЪЕКТЫ НА КАРТЕ (Грядки и Амбар из картинок) */
        .plot {
            width: 120px; height: 100px;
            background-image: url('https://openclipart.org'); /* Текстура вспаханной грядки */
            background-size: cover; border: 4px solid #5d4037; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; font-size: 12px; font-weight: bold; box-shadow: 0 6px 10px rgba(0,0,0,0.5);
        }
        .plot.growing { background-image: url('https://openclipart.org'); background-size: cover; color: #fff; }
        .plot.ready { background-image: url('https://openclipart.org'); background-size: cover; color: #fff; text-shadow: 1px 1px 3px #000; }

        /* СЕРАЯ КОНВЕЙЕРНАЯ ЛЕНТА (как на скриншоте) */
        .conveyor-belt {
            position: absolute; top: 380px; left: 670px; width: 45px; height: 150px;
            background: #757575; border-left: 4px solid #424242; border-right: 4px solid #424242;
            box-shadow: inset 0 0 10px #212121; display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }

        /* Анимированная движущаяся пшеница на ленте */
        .moving-wheat {
            font-size: 20px; margin: 10px 0;
            animation: moveDown 2s linear infinite;
            display: none; /* Появляется только при сборе урожая */
        }
        @keyframes moveDown {
            0% { transform: translateY(-50px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(160px); opacity: 0; }
        }

        /* Здание амбара / склада */
        .barn-building {
            position: absolute; top: 260px; left: 630px; width: 120px; height: 120px;
            background-image: url('https://openclipart.org'); /* Красивый красный амбар */
            background-size: contain; background-repeat: no-repeat; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="ui-layer">
        <div class="top-bar">
            <div class="resource-panel"><span>💎</span><span class="resource-val" id="crystals-val">0</span></div>
            <div class="resource-panel"><span>🟡</span><span class="resource-val" id="coins-val">1000</span></div>
        </div>
        <div class="side-menu">
            <div class="menu-item" onclick="watchAdsgramVideo()">📺<br>Реклама</div>
            <div class="menu-item" onclick="sellWheat()">🌾<br>Амбар (<span id="wheat-val">0</span>)</div>
        </div>
        <div class="dialog-box">
            <div class="avatar">👨‍🌾</div>
            <div>
                <strong style="color: #d84315;">Фермер Джек:</strong><br>
                <span id="dialog-text">Привет! Купи свою первую территорию, чтобы получать урожай.</span>
            </div>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="map" id="game-map">
            <div class="buy-card" id="card-territory" style="top: 500px; left: 500px;">
                <div class="card-title">⛏️ Грядка №1</div>
                <div class="card-price">1 000 🟡</div>
                <button class="btn-buy" onclick="buyTerritory()">Купить</button>
            </div>
            <div id="actual-plot" class="plot" style="top: 530px; left: 535px; position: absolute; display: none;" onclick="handlePlotClick()">
                Пусто<br>(Клик)
            </div>
            <div class="buy-card" style="top: 700px; left: 600px;">
                <div class="card-title">🐔 Курятник</div>
                <div class="card-price">5 000 🟡</div>
                <button class="btn-buy" onclick="alert('Копите монеты!')">Купить</button>
            </div>
        </div>
    </div>
    <script>
        let coins = 1000;
        let crystals = 0;
        let wheat = 0;
        let isTerritoryBought = false;
        let plotStatus = "empty";
        let growTimer = null;
        let timeLeft = 0;

        const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');
        let isDragging = false;
        let startX, startY;
        let currentX = -400, currentY = -400;

        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches.clientX - currentX;
            startY = e.touches.clientY - currentY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches.clientX - startX;
            currentY = e.touches.clientY - startY;
            currentX = Math.min(0, Math.max(currentX, viewport.clientWidth - 1500));
            currentY = Math.min(0, Math.max(currentY, viewport.clientHeight - 1500));
            map.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }, { passive: true });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        function updateUI() {
            document.getElementById("coins-val").innerText = coins;
            document.getElementById("crystals-val").innerText = crystals;
            document.getElementById("wheat-val").innerText = wheat;
            if (isTerritoryBought) {
                document.getElementById("card-territory").style.display = "none";
                document.getElementById("actual-plot").style.display = "flex";
            }
            saveGameProgress();
        }

        function buyTerritory() {
            if (coins >= 1000) {
                coins -= 1000;
                isTerritoryBought = true;
                document.getElementById("dialog-text").innerText = "Отлично! Теперь нажми на грядку, чтобы посадить пшеницу.";
                updateUI();
            } else {
                alert("Не хватает монет!");
            }
        }

        function handlePlotClick() {
            let plotEl = document.getElementById("actual-plot");
            if (plotStatus === "empty") {
                plotStatus = "growing";
                timeLeft = 5;
                plotEl.className = "plot growing";
                plotEl.innerHTML = `Рост...<br>${timeLeft}с`;
                growTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        plotEl.innerHTML = `Рост...<br>${timeLeft}с`;
                    } else {
                        clearInterval(growTimer);
                        plotStatus = "ready";
                        plotEl.className = "plot ready";
                        plotEl.innerHTML = "СОЗРЕЛО!<br>(Собрать)";
                    }
                }, 1000);
            } else if (plotStatus === "ready") {
                plotStatus = "empty";
                plotEl.className = "plot";
                plotEl.innerHTML = "Пусто<br>(Клик)";
                wheat++;
                document.getElementById("dialog-text").innerText = "Урожай в амбаре! Нажми на Амбар справа, чтобы продать его.";
                updateUI();
            }
        }

        function sellWheat() {
            if (wheat > 0) {
                coins += wheat * 50;
                alert(`Вы продали пшеницу на сумму ${wheat * 50} 🟡!`);
                wheat = 0;
                updateUI();
            } else {
                alert("Амбар пуст!");
            }
        }

        function watchAdsgramVideo() {
            if (window.AdsGram) {
                const AdController = window.AdsGram.init({ blockId: "42181" });
                AdController.show().then(() => {
                    crystals += 1;
                    updateUI();
                    alert("Успешно! Вы получили 1 💎");
                }).catch(() => {
                    alert("Реклама не была досмотрена.");
                });
            } else {
                alert("Рекламная сеть недоступна.");
            }
        }

        // --- ГАРАНТИРОВАННОЕ РАБОЧЕЕ СОХРАНЕНИЕ ДЛЯ ТЕСТОВ ---
        function saveGameProgress() {
            const gameData = { coins, crystals, wheat, isTerritoryBought };
            localStorage.setItem("dark_farm_local", JSON.stringify(gameData));
        }

        function loadGameProgress() {
            const savedData = localStorage.getItem("dark_farm_local");
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    coins = data.coins ?? 1000;
                    crystals = data.crystals ?? 0;
                    wheat = data.wheat ?? 0;
                    isTerritoryBought = data.isTerritoryBought ?? false;
                } catch (e) {}
            }
        }

        loadGameProgress();
        updateUI();
    </script>
</body>
</html>
