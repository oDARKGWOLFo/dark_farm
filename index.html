<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Farm</title>
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0b1d0c;
            color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; pointer-events: auto; width: 100%;
        }
        .resource-panel {
            background: linear-gradient(to bottom, #795548, #4e342e);
            border: 3px solid #3e2723; border-radius: 20px;
            display: flex; align-items: center; padding: 4px 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); min-width: 140px;
        }
        .resource-val { font-size: 16px; font-weight: bold; margin-left: 5px; color: #fff; }
        .side-menu {
            position: absolute; right: 10px; top: 120px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
        }
        .menu-item {
            background: linear-gradient(145deg, #a76d43, #794c27);
            border: 2px solid #5d3415; border-radius: 10px;
            width: 65px; height: 65px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer;
        }
        .dialog-box {
            background: #fff8e1; border: 4px solid #bcaaa4; border-radius: 15px;
            padding: 12px; display: flex; align-items: center; gap: 10px;
            color: #3e2723; font-weight: 500; font-size: 13px; box-shadow: 0 6px 12px rgba(0,0,0,0.3); pointer-events: auto;
            margin-bottom: 10px; position: relative;
        }
        .avatar { width: 45px; height: 45px; background: #ffb74d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .viewport { width: 100%; height: 100%; overflow: hidden; position: relative; cursor: grab; }
        .viewport:active { cursor: grabbing; }
        .map {
            width: 1500px; height: 1500px; background-color: #2e7d32;
            background-image: radial-gradient(#388e3c 15%, transparent 16%), radial-gradient(#1b5e20 15%, transparent 16%);
            background-size: 60px 60px; background-position: 0 0, 30px 30px;
            position: absolute; transform: translate3d(-400px, -400px, 0); will-change: transform;
        }
        .buy-card {
            position: absolute; background: linear-gradient(to bottom, #8d6e63, #5d4037);
            border: 3px solid #3e2723; border-radius: 15px; width: 150px; padding: 10px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .card-title { font-size: 13px; font-weight: bold; color: #ffecb3; }
        .card-price { font-size: 14px; font-weight: bold; color: #ffd54f; }
        .btn-buy {
            background: linear-gradient(to bottom, #29b6f6, #0288d1); border: 2px solid #01579b; border-radius: 8px; color: white;
            width: 100%; padding: 6px; font-weight: bold; font-size: 14px; cursor: pointer;
        }
        .plot {
            width: 80px; height: 80px; background-color: #3e2723; border: 3px solid #5d4037; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold;
        }
        .plot.growing { background-color: #558b2f; border-color: #689f38; }
        .plot.ready { background-color: #fbc02d; border-color: #f57f17; color: #000; }
    </style>
</head>
<body>
    <div class="ui-layer">
        <div class="top-bar">
            <div class="resource-panel"><span>💎</span><span class="resource-val" id="crystals-val">0</span></div>
            <div class="resource-panel"><span>🟡</span><span class="resource-val" id="coins-val">1000</span></div>
        </div>
        <div class="side-menu">
            <div class="menu-item" onclick="watchAdsgramVideo()">📺<br>Реклама</div>
            <div class="menu-item" onclick="sellWheat()">🌾<br>Амбар (<span id="wheat-val">0</span>)</div>
        </div>
        <div class="dialog-box">
            <div class="avatar">👨‍🌾</div>
            <div>
                <strong style="color: #d84315;">Фермер Джек:</strong><br>
                <span id="dialog-text">Привет! Купи свою первую территорию, чтобы получать урожай.</span>
            </div>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="map" id="game-map">
            <div class="buy-card" id="card-territory" style="top: 500px; left: 500px;">
                <div class="card-title">⛏️ Грядка №1</div>
                <div class="card-price">1 000 🟡</div>
                <button class="btn-buy" onclick="buyTerritory()">Купить</button>
            </div>
            <div id="actual-plot" class="plot" style="top: 530px; left: 535px; position: absolute; display: none;" onclick="handlePlotClick()">
                Пусто<br>(Клик)
            </div>
            <div class="buy-card" style="top: 700px; left: 600px;">
                <div class="card-title">🐔 Курятник</div>
                <div class="card-price">5 000 🟡</div>
                <button class="btn-buy" onclick="alert('Копите монеты!')">Купить</button>
            </div>
        </div>
    </div>
    <script>
        let coins = 1000;
        let crystals = 0;
        let wheat = 0;
        let isTerritoryBought = false;
        let plotStatus = "empty";
        let growTimer = null;
        let timeLeft = 0;

        const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');
        let isDragging = false;
        let startX, startY;
        let currentX = -400, currentY = -400;

        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches.clientX - currentX;
            startY = e.touches.clientY - currentY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches.clientX - startX;
            currentY = e.touches.clientY - startY;
            currentX = Math.min(0, Math.max(currentX, viewport.clientWidth - 1500));
            currentY = Math.min(0, Math.max(currentY, viewport.clientHeight - 1500));
            map.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }, { passive: true });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        function updateUI() {
            document.getElementById("coins-val").innerText = coins;
            document.getElementById("crystals-val").innerText = crystals;
            document.getElementById("wheat-val").innerText = wheat;
            if (isTerritoryBought) {
                document.getElementById("card-territory").style.display = "none";
                document.getElementById("actual-plot").style.display = "flex";
            }
            saveGameProgress();
        }

        function buyTerritory() {
            if (coins >= 1000) {
                coins -= 1000;
                isTerritoryBought = true;
                document.getElementById("dialog-text").innerText = "Отлично! Теперь нажми на грядку, чтобы посадить пшеницу.";
                updateUI();
            } else {
                alert("Не хватает монет!");
            }
        }

        function handlePlotClick() {
            let plotEl = document.getElementById("actual-plot");
            if (plotStatus === "empty") {
                plotStatus = "growing";
                timeLeft = 5;
                plotEl.className = "plot growing";
                plotEl.innerHTML = `Рост...<br>${timeLeft}с`;
                growTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        plotEl.innerHTML = `Рост...<br>${timeLeft}с`;
                    } else {
                        clearInterval(growTimer);
                        plotStatus = "ready";
                        plotEl.className = "plot ready";
                        plotEl.innerHTML = "СОЗРЕЛО!<br>(Собрать)";
                    }
                }, 1000);
            } else if (plotStatus === "ready") {
                plotStatus = "empty";
                plotEl.className = "plot";
                plotEl.innerHTML = "Пусто<br>(Клик)";
                wheat++;
                document.getElementById("dialog-text").innerText = "Урожай в амбаре! Нажми на Амбар справа, чтобы продать его.";
                updateUI();
            }
        }

        function sellWheat() {
            if (wheat > 0) {
                coins += wheat * 50;
                alert(`Вы продали пшеницу на сумму ${wheat * 50} 🟡!`);
                wheat = 0;
                updateUI();
            } else {
                alert("Амбар пуст!");
            }
        }

        function watchAdsgramVideo() {
            if (window.AdsGram) {
                const AdController = window.AdsGram.init({ blockId: "42181" });
                AdController.show().then(() => {
                    crystals += 1;
                    updateUI();
                    alert("Успешно! Вы получили 1 💎");
                }).catch(() => {
                    alert("Реклама не была досмотрена.");
                });
            } else {
                alert("Рекламная сеть недоступна.");
            }
        }

        // --- ГАРАНТИРОВАННОЕ РАБОЧЕЕ СОХРАНЕНИЕ ДЛЯ ТЕСТОВ ---
        function saveGameProgress() {
            const gameData = { coins, crystals, wheat, isTerritoryBought };
            localStorage.setItem("dark_farm_local", JSON.stringify(gameData));
        }

        function loadGameProgress() {
            const savedData = localStorage.getItem("dark_farm_local");
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    coins = data.coins ?? 1000;
                    crystals = data.crystals ?? 0;
                    wheat = data.wheat ?? 0;
                    isTerritoryBought = data.isTerritoryBought ?? false;
                } catch (e) {}
            }
        }

        loadGameProgress();
        updateUI();
    </script>
</body>
</html>
