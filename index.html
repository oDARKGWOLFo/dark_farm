<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Farm</title>
    <!-- Официальный скрипт Adsgram SDK -->
    <script src="https://adsgram.ai"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Запрещаем стандартный скролл браузера */
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Фиксированный интерфейс поверх карты */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Пропускаем клики сквозь интерфейс на карту */
            z-index: 10;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(22,22,22,0.9));
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
            pointer-events: auto; /* Возвращаем кликабельность элементам баланса */
        }
        .balance-container {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .balance-item {
            font-size: 16px;
            font-weight: bold;
            background: #262626;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #3d3d3d;
        }
        .actions {
            pointer-events: auto; /* Возвращаем кликабельность нижним кнопкам */
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: env(safe-area-inset-bottom, 10px);
        }
        .btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-ad { background: #0288d1; }
        .btn-upgrade { background: #ef6c00; }

        /* Огромная двигающаяся база-карта */
        .viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .viewport:active { cursor: grabbing; }
        
        .map {
            width: 1200px; /* Размер игрового поля */
            height: 1200px;
            background-color: #1b3a1e; /* Темно-зеленая земля фермы */
            background-image: 
                radial-gradient(#274e2c 20%, transparent 20%),
                radial-gradient(#224527 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            position: absolute;
            top: 0;
            left: 0;
            transform: translate3d(-300px, -300px, 0); /* Центрируем карту при старте */
            will-change: transform;
        }

        /* Элементы на карте (Грядки) */
        .farm-zone {
            position: absolute;
            top: 500px; /* Размещаем грядки ровно по центру огромной карты */
            left: 500px;
            background: rgba(0,0,0,0.25);
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed rgba(255,255,255,0.1);
        }
        .grid {
            display: flex;
            gap: 15px;
        }
        .plot {
            width: 90px;
            height: 90px;
            background-color: #3e2723;
            border: 3px solid #5d4037;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .plot.growing { background-color: #558b2f; border-color: #689f38; }
        .plot.ready {
            background-color: #fbc02d;
            border-color: #f57f17;
            color: #000;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Слой фиксированного интерфейса поверх карты -->
    <div class="ui-layer">
        <div class="header">
            <h2 style="margin:0; color:#fff; font-size: 20px; text-align: center;">🌾 Dark Farm</h2>
            <div class="balance-container">
                <div class="balance-item">🟡 Монеты: <span id="coins-val">0</span></div>
                <div class="balance-item">💎 Кристаллы: <span id="crystals-val">0</span></div>
            </div>
            <div style="margin-top: 10px; font-size: 14px; text-align: center;">Амбар: <span id="wheat-val">0</span> / 50 🌾</div>
        </div>

        <div class="actions">
            <button class="btn" onclick="sellAllWheat()">Продать всю пшеницу (1 🌾 = 10 🟡)</button>
            <button class="btn btn-ad" onclick="watchAdsgramVideo()">Посмотреть рекламу (+1 💎)</button>
            <button class="btn btn-upgrade" id="upgrade-btn" onclick="buySecondPlot()">Купить 2-ю грядку (100 🟡 или 1 💎)</button>
        </div>
    </div>

    <!-- Игровое пространство с двигающейся картой -->
    <div class="viewport" id="viewport">
        <div class="map" id="game-map">
            
            <!-- Грядки, жестко привязанные к координатам карты -->
            <div class="farm-zone">
                <div class="grid">
                    <div id="plot-1" class="plot" onclick="handlePlotClick(1)">Пусто<br>(Клик)</div>
                    <div id="plot-2" class="plot" style="display:none;" onclick="handlePlotClick(2)">Пусто<br>(Клик)</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Экономическое состояние
        let coins = 0;
        let crystals = 0;
        let wheat = 0;
        let hasSecondPlot = false;

        let plotsState = {
            1: { status: "empty", timer: null, timeLeft: 0 },
            2: { status: "empty", timer: null, timeLeft: 0 }
        };

        const GROW_TIME = 5; // Время роста пшеницы

        // --- МЕХАНИКА ДВИЖЕНИЯ КАРТЫ ПАЛЬЦЕМ (DRAG & SCROLL) ---
        const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');
        
        let isDragging = false;
        let startX, startY;
        let currentX = -300, currentY = -300; // Стартовое центрирование

        // Сенсорное управление для смартфонов
        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX - currentX;
            startY = e.touches[0].clientY - currentY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            currentX = e.touches[0].clientX - startX;
            currentY = e.touches[0].clientY - startY;

            // Запрещаем вытаскивать карту за видимые границы экрана
            currentX = Math.min(0, Math.max(currentX, viewport.clientWidth - 1200));
            currentY = Math.min(0, Math.max(currentY, viewport.clientHeight - 1200));

            map.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }, { passive: true });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        // Управление мышкой (для проверки с компьютера)
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
        });
        viewport.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            currentX = Math.min(0, Math.max(currentX, viewport.clientWidth - 1200));
            currentY = Math.min(0, Math.max(currentY, viewport.clientHeight - 1200));
            map.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });


        // --- ИГРОВАЯ ЛОГИКА ФЕРМЫ ---
        function updateUI() {
            document.getElementById("coins-val").innerText = coins;
            document.getElementById("crystals-val").innerText = crystals;
            document.getElementById("wheat-val").innerText = wheat;

            if (hasSecondPlot) {
                document.getElementById("plot-2").style.display = "flex";
                document.getElementById("upgrade-btn").style.display = "none";
            }
        }

        function handlePlotClick(plotId) {
            let plot = plotsState[plotId];
            let plotEl = document.getElementById(`plot-${plotId}`);

            if (plot.status === "empty") {
                plot.status = "growing";
                plot.timeLeft = GROW_TIME;
                plotEl.className = "plot growing";
                plotEl.innerHTML = `Рост...<br>${plot.timeLeft}с`;

                plot.timer = setInterval(() => {
                    plot.timeLeft--;
}, 1000);

            } else if (plot.status === "ready") {
                if (wheat >= 50) {
                    alert("Амбар заполнен! Продайте пшеницу.");
                    return;
                }
                plot.status = "empty";
                plotEl.className = "plot";
                plotEl.innerHTML = "Пусто<br>(Клик)";
                wheat++;
                updateUI();
            }
        }

        function sellAllWheat() {
            if (wheat > 0) {
                coins += wheat * 10;
                alert(`Вы успешно продали ${wheat} 🌾 и получили ${wheat * 10} 🟡!`);
                wheat = 0;
                updateUI();
            } else {
                alert("У вас нет пшеницы на продажу!");
            }
        }

        function buySecondPlot() {
            if (hasSecondPlot) return;

            if (coins >= 100) {
                coins -= 100;
                hasSecondPlot = true;
                updateUI();
                alert("Вы открыли новую грядку за монеты!");
            } else if (crystals >= 1) {
                if (confirm("Не хватает монет. Хотите открыть новую грядку за 1 💎?")) {
                    crystals -= 1;
                    hasSecondPlot = true;
                    updateUI();
                    alert("Вы открыли новую грядку за Кристаллы!");
                }
            } else {
                alert("Не хватает ресурсов! Требуется 100 🟡 или 1 💎. Получите Кристаллы за просмотр рекламы.");
            }
        }

        function watchAdsgramVideo() {
            if (window.AdsGram) {
                const AdController = window.AdsGram.init({ blockId: "42181" });
                
                AdController.show().then((result) => {
                    crystals += 1;
                    updateUI();
                    alert("Успешно! Вам начислен 1 💎");
                }).catch((result) => {
                    alert("Рекламный ролик не был досмотрен.");
                });
            } else {
                alert("Не удалось загрузить рекламу. Проверьте подключение или отключите AdBlock.");
            }
        }

        updateUI();
    </script>
</body>
</html>
