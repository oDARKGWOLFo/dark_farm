<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя Ферма</title>
    <style>
        /* Сброс стандартных стилей браузера */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }

        /* Экран телефона (Окно, через которое мы видим карту) */
        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Игровая карта (Большое поле, которое можно двигать) */
        #game-map {
            width: 1500px;
            height: 1500px;
            position: absolute;
            
            /* Красивый сочный зеленый газон с эффектом травы */
            background-color: #2e5c1e;
            background-image: 
                radial-gradient(#3a6f28 15%, transparent 16%),
                radial-gradient(#3a6f28 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            
            /* Мягкая внутренняя тень по краям карты для реалистичности */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5);
            
            /* Плавный запуск координат */
            transform: translate3d(-350px, -350px, 0);
            will-change: transform;
        }

        /* Временная разметка центра карты, чтобы видеть движение */
        .map-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Окно просмотра -->
    <div id="viewport">
        <!-- Игровая карта -->
        <div id="game-map">
            <div class="map-center">Центр фермы</div>
            <!-- Сюда в следующих шагах мы будем добавлять грядки, амбар и курятник -->
        </div>
    </div>

    <script>
        // Инициализация координат (карта сразу центрирована)
        const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');

        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = -350, currentY = -350;

        // Касание пальцем экрана
        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX - currentX;
            startY = e.touches[0].clientY - currentY;
        }, { passive: true });

        // Движение пальца по экрану
        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            currentX = e.touches[0].clientX - startX;
            currentY = e.touches[0].clientY - startY;

            // Рассчитываем жесткие границы, чтобы карта не улетала за экран
            const minX = viewport.clientWidth - 1500;
            const minY = viewport.clientHeight - 1500;

            // Ограничиваем движение (0 — верхний/левый край, min — нижний/правый край)
            currentX = Math.min(0, Math.max(currentX, minX));
            currentY = Math.min(0, Math.max(currentY, minY));

            // Плавное перемещение карты через аппаратное ускорение телефона
            map.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }, { passive: true });

        // Палец подняли с экрана
        viewport.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
