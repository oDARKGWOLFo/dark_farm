<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jack's Farm Clone</title>
    <style>
        /* ==========================================================================
           1. СБРОС И БАЗОВЫЕ НАСТРОЙКИ (ЭКРАН ТЕЛЕФОНА)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #101b07;
            font-family: Arial, sans-serif;
        }

        /* Окно просмотра игры на мобильном */
        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

/* ==========================================================================
           2. ИГРОВАЯ КАРТА И ТРАВА (Размер: 12 блоков ширина, 24 блока высота)
           ========================================================================== */
        #game-map {
            position: absolute;
            /* 12 блоков * 32px = 384px в ширину */
            width: 384px;  
            /* 24 блока * 32px = 768px в высоту */
            height: 768px; 
            
            /* Авто-выравнивание ровно по центру мобильного экрана */
            left: calc(50% - 192px);
            top: calc(50% - 384px);
            
            /* Сочный, яркий цвет травы */
            background-color: #62b132;
            
            /* Сетка из аккуратных блоков по 32px */
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            
            /* Ровный угол обзора сверху вниз */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }

        /* ==========================================================================
           3. РАЗДЕЛ: СТИЛИ ДОРОГ И КОНВЕЙЕРА
           ========================================================================== */
        /* Песчаная дорога у магазина и склада */
        .sand-road {
            position: absolute;
            background-color: #f7df9a;
            border-radius: 20px;
            z-index: 1;
        }

        /* Конвейерная лента для ресурсов */
        .conveyor-belt {
            position: absolute;
            background: linear-gradient(90deg, #444 0%, #777 50%, #444 100%);
            border-left: 3px solid #222;
            border-right: 3px solid #222;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* ==========================================================================
           4. РАЗДЕЛ: СТИЛИ СТРУКТУР И ПОСТРОЕК
           ========================================================================== */
        /* Общий стиль для всех карточек и зданий */
        .building-card {
            position: absolute;
            background-color: #4a2f13;
            border: 4px solid #2b1808;
            border-radius: 12px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 3;
        }

        /* Кнопки покупки внутри построек */
        .btn-action {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            border: 2px solid #1f5f8a;
            border-radius: 6px;
            color: white;
            padding: 4px 12px;
            margin-top: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Магазин грузовика (Продать) */
        .shop-building {
            background-color: #8e44ad;
            border-color: #6c3483;
        }
        .btn-sell {
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            border-color: #962d22;
        }

        /* Большой Склад/Амбар */
        .barn-building {
            background-color: #c0392b;
            border-color: #7f8c8d;
        }

        /* Система огорода из 9 грядок */
        .farm-plot-zone {
            position: absolute;
            width: 180px;
            height: 140px;
            background-color: #8b5a2b;
            border: 4px solid #5c4033;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            z-index: 3;
        }
        .single-grid {
            background-color: #5c4033;
            border-radius: 3px;
            border: 1px solid #4a3226;
        }

        /* Код для загона коров (Добавлено в самый конец раздела структур, как ты просил) */
        .cow-coop-building {
            background-color: #7f8c8d;
            border-color: #34495e;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- ==========================================================================
             ИГРОВАЯ КАРТА (На первом месте в самом верху тела документа)
             ========================================================================== -->
        <div id="game-map">

            <!-- РАЗДЕЛ: ДОРОГИ И ТРОПИНКИ -->
            <!-- Песочная зона вверху для грузовика -->
            <div class="sand-road" style="top: 1400px; left: 1450px; width: 300px; height: 160px;"></div>
            
            <!-- Вертикальная железная лента конвейера к складу -->
            <div class="conveyor-belt" style="top: 1500px; left: 1720px; width: 40px; height: 350px;"></div>


            <!-- РАЗДЕЛ: ДОБАВЛЕНИЕ СТРУКТУР И ПОСТРОЕК -->
            
            <!-- 1. Магазин с грузовиком (Продать) -->
            <div class="building-card shop-building" style="top: 1420px; left: 1480px; width: 140px; height: 110px;">
                Магазин
                <button class="btn-action btn-sell">Продать</button>
            </div>

            <!-- 2. Большой склад (Куда ведет конвейер) -->
            <div class="building-card barn-building" style="top: 1480px; left: 1680px; width: 120px; height: 130px;">
                Склад
            </div>

            <!-- 3. Система огорода (9 грядок земли) -->
            <div class="farm-plot-zone" style="top: 1620px; left: 1500px;">
                <!-- 9 индивидуальных ячеек земли -->
                <div class="single-grid"></div><div class="single-grid"></div><div class="single-grid"></div>
                <div class="single-grid"></div><div class="single-grid"></div><div class="single-grid"></div>
                <div class="single-grid"></div><div class="single-grid"></div><div class="single-grid"></div>
            </div>

            <!-- 4. Загон для Курицы (Купить за 5000) -->
            <div class="building-card" style="top: 1800px; left: 1510px; width: 160px; height: 100px;">
                Продаётся<br>5 000 🟡
                <button class="btn-action">Купить</button>
            </div>

            <!-- 5. Загон для Коров (Добавлен с новой строки в самом конце раздела структур) -->
            <div class="building-card cow-coop-building" style="top: 1930px; left: 1510px; width: 160px; height: 100px;">
                Продаётся<br>25 000 🟡
                <button class="btn-action">Купить</button>
            </div>

        </div>
    </div>

    <!-- ==========================================================================
         5. РАЗДЕЛ: ЛОГИКА И СКРИПТЫ (Движение камеры)
         ========================================================================== -->
    <script>
const viewport = document.getElementById('viewport');
        const map = document.getElementById('game-map');

        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;

        // Настройка лимитов скролла под размер экрана телефона
        function getLimits() {
            const minX = Math.min(0, viewport.clientWidth - 384);
            const minY = Math.min(0, viewport.clientHeight - 768);
            return { minX, minY };
        }

        viewport.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches.clientX - currentX;
            startY = e.touches.clientY - currentY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging) return;

            currentX = e.touches.clientX - startX;
            currentY = e.touches.clientY - startY;

            const limits = getLimits();

            // Жестко останавливаем карту на границах 12х24 блоков, без черных дыр
            currentX = Math.min(Math.abs(limits.minX)/2, Math.max(currentX, limits.minX - Math.abs(limits.minX)/2));
            currentY = Math.min(0, Math.max(currentY, limits.minY));

            map.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
