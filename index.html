<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Farm Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a2e10;
            font-family: Arial, sans-serif;
        }

        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #camera-pan {
            position: absolute;
            width: 0;
            height: 0;
            top: 50%;
            left: 50%;
            will-change: transform;
        }

        #camera-zoom {
            width: 0;
            height: 0;
            will-change: transform;
        }

        /* Изометрическая 3D-карта 100х100 блоков (4000px) */
        #game-map {
            position: absolute;
            width: 4000px;
            height: 4000px;
            left: -2000px;
            top: -2000px;
            
            /* Светло-зелёная шахматная трава */
            background-color: #7cd13d;
            background-image: 
                linear-gradient(45deg, #86db46 25%, transparent 25%, transparent 75%, #86db46 75%, #86db46),
                linear-gradient(45deg, #86db46 25%, #7cd13d 25%, #7cd13d 75%, #86db46 75%, #86db46);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;

            /* Наклон карты справа налево */
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-style: preserve-3d;
        }

        /* ИСПРАВЛЕНО: Дорога идет ровно от центра карты к нижнему левому краю экрана */
        .dirt-road {
            position: absolute;
            top: 1960px;         /* По центру по вертикали */
            left: 0;             /* Начинается от левого края карты */
            width: 2040px;       /* Доходит ровно до центра (до порога дома) */
            height: 80px;        /* Ширина дороги в 2 блока */
            
            /* Качественная текстура грунтовой дороги */
            background-image: url('https://transparenttextures.com'), linear-gradient(to bottom, #d0a46c, #b58951);
            border-top: 4px solid #6e4720;
            border-bottom: 4px solid #6e4720;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            z-index: 1;
        }

        /* Контейнер для вертикальных объектов */
        .iso-object {
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateZ(45deg) rotateX(-60deg);
            transform-origin: bottom center;
        }

        /* ИСПРАВЛЕНО: Точное расположение дома у окончания дороги в центре */
        .house-position {
            top: 1840px;         
            left: 1980px;        
            width: 160px;        
            height: 160px;
            z-index: 10;
        }

        /* Качественный 3D-спрайт мультяшного дома */
        .farm-house-sprite {
            width: 100%;
            height: 100%;
            background-image: url('https://flaticon.com');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            filter: drop-shadow(-15px 15px 10px rgba(0,0,0,0.3));
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="camera-pan">
            <div id="camera-zoom">
                <div id="game-map">
                    
                    <!-- Дорога, идущая из верхнего правого угла в нижний левый -->
                    <div class="dirt-road"></div>

                    <!-- Качественный 3D дом из спрайта -->
                    <div class="iso-object house-position">
                        <div class="farm-house-sprite"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const panContainer = document.getElementById('camera-pan');
        const zoomContainer = document.getElementById('camera-zoom');

        // Камера сразу наведена на дом в центре поля
        let currentX = 0, currentY = -50; 
        let currentZoom = 0.8;

        const MIN_ZOOM = 0.4;
        const MAX_ZOOM = 2.0;

        let isDragging = false;
        let startX = 0, startY = 0;
        let startPinchDist = 0;
        let startZoom = 1.0;

        function applyTransforms() {
            panContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            zoomContainer.style.transform = `scale(${currentZoom})`;
        }

        function getPinchDistance(e) {
            if (e.touches.length < 2) return 0;
            const t1 = e.touches[0];
            const t2 = e.touches[1];
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - currentX;
                startY = e.touches[0].clientY - currentY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                startPinchDist = getPinchDistance(e);
                startZoom = currentZoom;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                currentX = e.touches[0].clientX - startX;
                currentY = e.touches[0].clientY - startY;
                
                currentX = Math.min(1200, Math.max(currentX, -1200));
                currentY = Math.min(1200, Math.max(currentY, -1200));
                
                applyTransforms();
            } else if (e.touches.length === 2) {
                const currentDist = getPinchDistance(e);
                if (startPinchDist > 0 && currentDist > 0) {
                    const factor = currentDist / startPinchDist;
                    currentZoom = startZoom * factor;
                    currentZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, currentZoom));
                    applyTransforms();
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                isDragging = false;
            } else if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - currentX;
                startY = e.touches[0].clientY - currentY;
            }
        });

        applyTransforms();
    </script>
</body>
</html>
